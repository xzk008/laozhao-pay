name: Build unsigned IPA

# 触发方式：手动点「Run workflow」，或推代码到 main / master 分支
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    # 用 macOS 15 跑者：自带 Xcode 16，能打开 XcodeGen 生成的 objectVersion 77 工程
    runs-on: macos-15

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 选用最新的 Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          NEWEST="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST"; fi
          xcodebuild -version
          sw_vers

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          xcodegen generate
          grep -m1 objectVersion LaozhaoPay.xcodeproj/project.pbxproj || true

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project LaozhaoPay.xcodeproj \
            -scheme LaozhaoPay \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tail -120

      - name: 打包成 .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/LaozhaoPay.app"
          ls -l "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr LaozhaoPay-unsigned.ipa Payload
          ls -lh LaozhaoPay-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: LaozhaoPay-unsigned-ipa
          path: LaozhaoPay-unsigned.ipa
          retention-days: 30
